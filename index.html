<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">分数</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">最高分</div>
          <div class="score-value" id="best">0</div>
        </div>
      </div>
    </header>

    <p class="subtitle">合并相同数字，向 <b>2048</b> 进发！</p>
        <div class="board" id="board">
      <!-- 16 个背景小格子以后由 script.js 自动生成 -->

      <div class="overlay" id="overlay">
        <div class="overlay-inner">
          <div class="overlay-title" id="overlayTitle"></div>
          <div class="overlay-text" id="overlayText"></div>
          <button class="btn" id="overlayBtn">再来一局</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="newGameBtn">新游戏</button>
    </div>

    <p class="howto">
      操作：键盘 <b>↑ ↓ ← →</b> 或 <b>W A S D</b><br />
      手机 / 平板上：直接在棋盘上<b>滑动</b>
    </p>

      </div>

  <script src="script.js"></script>
</body>
</html>
