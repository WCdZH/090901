<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 2048</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" />
</head>
<body class="login-body">
  <div class="login-box">
    <h1 class="login-title">欢迎回来</h1>
    <p class="login-subtitle">登录后开始游戏</p>

    <label class="login-label" for="username">用户名</label>
    <input class="login-input" id="username" type="text" placeholder="请输入用户名" />

    <label class="login-label" for="password">密码</label>
    <input class="login-input" id="password" type="password" placeholder="请输入密码" />

    <button class="btn login-btn" id="loginBtn">登 录</button>
    <p class="login-msg" id="loginMsg"></p>
  </div>

  <script>
    const nameInput = document.getElementById('username');
    const pwdInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMsg');

    // ① 打开页面时：如果之前记住过用户名，就自动填上
    nameInput.value = localStorage.getItem('login_name') || '';

    // ② 登录逻辑抽成一个函数（按钮和回车都能复用）
    function doLogin() {
      const name = nameInput.value.trim();
      const pwd = pwdInput.value;

      if (name === '' || pwd === '') {
        msg.textContent = '用户名和密码不能为空';
        return;
      }
      if (pwd.length < 6) {
        msg.textContent = '密码至少要 6 位';
        return;
      }

      localStorage.setItem('login_name', name); // 记住用户名
      window.location.href = 'game.html';       // 进入游戏
    }

    // ③ 点按钮登录
    loginBtn.addEventListener('click', doLogin);

    // ④ 在用户名或密码框里按回车，也能登录
    [nameInput, pwdInput].forEach((input) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });
    });
  </script>
</body>
</html>
